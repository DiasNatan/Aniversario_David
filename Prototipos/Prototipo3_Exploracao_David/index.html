  <style>
    :root{font-family:Trebuchet MS,system-ui,sans-serif;color:#fff8e8;background:#102522;--gold:#f3c765;--ink:#14332f;--panel:#173b36;--line:#f3d58a;--cream:#fff5dd;--red:#963e30}

    .hotspot{position:absolute;z-index:2;transform:translate(-50%,-50%);border:2px solid #fff1b7;background:#173b36d9;border-radius:50%;min-width:48px;min-height:48px;font-size:24px;box-shadow:0 3px 14px #0008;display:grid;place-items:center}.hotspot:hover{transform:translate(-50%,-50%) scale(1.08)}
    .actions{position:absolute;z-index:2;bottom:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.action-btn{background:#183d38ef;box-shadow:0 3px 10px #0006}.action-btn.primary{background:var(--gold);color:#203b31;border-color:#fff1b7}
    footer{display:flex;align-items:center;gap:8px;padding:7px 9px;background:#14342f;border-top:1px solid #ffffff30;z-index:2;min-height:58px}.tool{display:flex;align-items:center;justify-content:center;gap:7px;background:#74542a;border:1px solid #e4c47a;border-radius:10px;padding:8px 12px;font-weight:800;min-height:42px}.tool svg{width:22px;height:22px;fill:none;stroke:#fff1c5;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.inventory{display:flex;align-items:center;gap:4px;flex:1;overflow:auto}.slot{flex:0 0 42px;width:42px;height:42px;border-radius:9px;background:#e5d0a5;color:#182e28;display:grid;place-items:center;font-size:22px;position:relative}.slot.empty{opacity:.35}.slot span{position:absolute;bottom:-2px;right:3px;font-size:9px;font-weight:800}
    .signpost{position:absolute;z-index:4;isolation:isolate;right:3%;bottom:18%;display:flex;flex-direction:column;align-items:flex-end;gap:8px;width:min(290px,31%);padding-bottom:34px}.signpost:after{content:"";position:absolute;z-index:-1;right:32px;bottom:0;width:12px;height:100%;border:2px solid #8b5b2e;border-radius:8px 8px 0 0;background:linear-gradient(90deg,#9c6938,#d2a56a 50%,#80502a);box-shadow:3px 0 8px #0005}.signpost-icon{position:absolute;right:15px;bottom:-5px;width:44px;height:64px;fill:#76502b;stroke:#e7c985;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sign-label{position:relative;z-index:1;width:calc(100% - 18px);min-height:38px;padding:7px 22px 7px 12px;border:2px solid #f8e5a8;border-radius:7px 2px 2px 7px;background:linear-gradient(110deg,#285c44,#194533);color:#fff8df;text-align:left;font-size:clamp(11px,1.4vw,15px);font-weight:900;box-shadow:0 3px 9px #0006}.sign-label:after{content:"";position:absolute;right:-14px;top:7px;width:20px;height:20px;transform:rotate(45deg);background:#194533;border-top:2px solid #f8e5a8;border-right:2px solid #f8e5a8}.sign-label:hover{filter:brightness(1.15);transform:translateX(-3px)}
    .map-reference{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(250px,.85fr);align-items:center;gap:clamp(12px,3vw,32px);padding:clamp(14px,3vw,34px);background:#294b3b;overflow:auto}.map-art{width:100%;max-height:78vh;object-fit:contain;border:8px solid #e1c987;border-radius:14px;box-shadow:0 12px 30px #0006}.map-route{padding:clamp(16px,3vw,30px);border:2px solid #e1c987;border-radius:18px;background:#fff5dd;color:#284339;box-shadow:0 10px 28px #0005}.map-route h2{margin:0 0 14px;color:#24453b;font-size:clamp(18px,2.4vw,28px)}.map-route>div{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-weight:800;line-height:1.35}.map-route i{color:#af8137;font-style:normal;font-size:20px}.map-back{position:absolute;right:clamp(14px,3vw,34px);bottom:clamp(14px,3vw,34px);min-height:44px;padding:8px 16px;border:1px solid #f3d58a;border-radius:10px;background:#173b36;color:#fff8e8;font-weight:800}
    .overlay{position:absolute;z-index:10;inset:0;background:#071511c9;display:grid;place-items:center;padding:12px}.card{width:min(820px,100%);max-height:calc(100% - 4px);overflow:auto;background:var(--cream);color:#24372f;border:3px solid #e1ba63;border-radius:18px;padding:clamp(14px,3vw,24px);box-shadow:0 16px 48px #0008}.card h1,.card h2,.card h3{margin:0 0 8px;color:#24453b}.card p{line-height:1.45}.card-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.card button,.choice{border:1px solid #74542a;border-radius:10px;background:#f4e6c7;color:#24372f;padding:10px 14px;min-height:44px;font-weight:800}.card button.primary{background:var(--gold)}.small{font-size:12px;color:#52645a}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice{font-size:clamp(15px,2vw,20px)}
    .food-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.food-card{min-height:68px;font-size:30px}.memory-board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}.memory-card{aspect-ratio:1;border:2px solid #897447;border-radius:10px;background:#e3d1a7;color:#203b31;font-size:clamp(20px,4vw,40px);display:grid;place-items:center;min-width:0;min-height:40px}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:6px}.compare figure{margin:0;position:relative}.compare img{width:100%;height:auto;display:block;border-radius:8px}.diff-hit{position:absolute;transform:translate(-50%,-50%);width:clamp(28px,5vw,54px);height:clamp(28px,5vw,54px);border:2px solid transparent;border-radius:50%;background:#fff1;min-width:0;padding:0}.diff-hit.found{border-color:#25b65e;background:#25b65e33}
    .target{width:min(52vw,280px);aspect-ratio:1;border-radius:50%;margin:8px auto;background:repeating-radial-gradient(circle,#fff 0 9%,#c94835 9% 18%,#fff 18% 27%,#3167a0 27% 36%,#f5d76b 36% 45%,#fff 45% 54%);border:3px solid #473c30;position:relative;touch-action:manipulation}.target:after{content:"";position:absolute;left:50%;top:50%;width:14%;height:14%;transform:translate(-50%,-50%);border-radius:50%;background:#bf3e32;border:2px solid #fff}
    .lane{height:min(44vh,260px);background:linear-gradient(90deg,#31594e 24%,#23483d 25%,#31594e 49%,#23483d 50%,#31594e 74%,#23483d 75%);position:relative;overflow:hidden;border:2px solid #d6bc74;border-radius:12px}.note{position:absolute;width:19%;height:28px;border-radius:14px;background:var(--gold);box-shadow:0 0 14px #ffed9b;display:grid;place-items:center;font-size:12px;font-weight:900;color:#263b31}.lane-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.lane-pad button{font-size:20px;min-height:44px}

    .road-frame,.river-frame{display:grid;justify-items:center;gap:8px}.road-frame iframe{width:min(100%,1000px);height:min(68vh,680px);border:0;border-radius:12px;background:#0d1117}.river-frame iframe{width:min(100%,51vh);height:min(68vh,680px);aspect-ratio:3/4;border:0;border-radius:12px;background:#e8f1f2}.road-return,.river-return{border:1px solid #74542a;border-radius:10px;background:#f4e6c7;color:#24372f;padding:8px 14px;min-height:40px;font-weight:800}

    .journal{padding:8px}.journal-heading{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px dashed #c6a860}.journal-heading svg{width:48px;height:48px;flex:0 0 48px;fill:none;stroke:#805a27;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.journal-heading h2{margin:0;color:#24453b}.journal-heading p{margin:3px 0 0;font-size:13px;color:#657267}.note-list{display:grid;gap:10px;margin:14px 0}.note-entry{position:relative;padding:12px 14px 12px 19px;border-left:5px solid #d2a64e;background:repeating-linear-gradient(0deg,#fff9e8 0 28px,#ebdfc3 29px,#fff9e8 30px);border-radius:5px 12px 12px 5px;box-shadow:0 2px 6px #6b563322;line-height:1.45}.note-entry b{color:#755320}.safe-digits{display:flex;justify-content:center;gap:5px;margin:12px 0}.safe-digits input{width:42px;height:50px;text-align:center;font-size:24px;border-radius:7px;border:2px solid #627b69;background:#fffdf5;color:#203b31}.memory-info,.scoreline{display:flex;justify-content:space-between;gap:10px;font-weight:800}
    @keyframes bubble-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

    /* As composições de Cenas/ são telas 16:9 completas, com placas, personagens e moldura já desenhados. */
    body{display:grid;place-items:center;background:#102b36}
    #game{width:min(100vw,177.7778vh);height:min(100dvh,56.25vw);aspect-ratio:16/9;display:block;max-width:none;margin:0;background:#102b36;overflow:hidden}
    #game>header,#game>footer{display:none}

    .map-title{position:absolute;left:4.7%;top:1.3%;z-index:2;margin:0;color:#fff8e8;font-size:clamp(16px,2vw,28px);text-shadow:0 2px 4px #0008}
    .map-note{position:absolute;left:4.7%;bottom:4%;z-index:2;color:#fff8e8;font-size:clamp(11px,1vw,15px)}
    .toast-message{z-index:9;bottom:10%;font-size:clamp(13px,1.3vw,18px)}
    .overlay{z-index:12}
    .overlay .card{max-width:min(820px,92%);max-height:90%;}
    .overlay.fullscreen-minigame{position:fixed;inset:0;z-index:1000;display:block;padding:0;background:#102522;}
    .overlay.fullscreen-minigame>.card{width:100%;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;overflow:auto;border:0;border-radius:0;background:#102522;box-shadow:none;}
    .overlay.fullscreen-minigame .minigame-host{display:block;width:100%;height:100%;min-height:100dvh;border:0;background:#102522;}
    #game:has(.fullscreen-minigame):after{display:none;}
    .overlay.native-minigame>.card{padding:clamp(14px,3vw,28px);background:var(--cream);color:#24372f;}
    .overlay.native-minigame .compare{max-height:calc(100dvh - 190px);overflow:auto;}
    .card .diff-hit{position:absolute;transform:translate(-50%,-50%);width:clamp(24px,3vw,40px);height:clamp(24px,3vw,40px);min-height:0;padding:0;border:2px solid transparent;border-radius:50%;background:transparent;box-shadow:none;opacity:0;}
    .card .diff-hit:hover,.card .diff-hit:focus-visible{opacity:0;border-color:transparent;background:transparent;outline:none;}
    .card .diff-hit.found{opacity:.78;border-color:#27834c;background:#31a35a55;}
    .clinic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.5vw,16px);width:min(100%,720px);margin:14px auto}
    .card .clinic-choice{display:grid;place-items:center;min-width:0;min-height:clamp(68px,14vh,130px);padding:6px;border:2px solid #c8b477;border-radius:16px;background:#fffaf0;font-size:clamp(32px,8vh,64px);box-shadow:0 4px 12px #0002;touch-action:manipulation}
    .card .clinic-choice.correct{border-color:#318254;background:#dff2df;opacity:.72}.card .clinic-choice.wrong{border-color:#b84c3d;background:#f9ded8;opacity:.72}
    .clinic-status{text-align:center;font-size:clamp(16px,2.2vw,22px);font-weight:800;color:#24453b}.clinic-result{text-align:center;font-size:22px;font-weight:800}
    @media (orientation:portrait){#game{width:min(100vw,177.7778vh);height:min(100dvh,56.25vw)}#game:after{position:fixed;inset:0;}}
  </style>
</head>

    <header><div id="sceneName" class="scene-name">Frente da casa</div><div id="status" class="status"></div></header>

      <button id="mapButton" class="tool" type="button" aria-label="Abrir mapa ilustrativo"><svg viewBox="0 0 48 40" aria-hidden="true"><path d="m3 8 13-5 16 5 13-5v29l-13 5-16-5-13 5zM16 3v29M32 8v29"/></svg><span>Mapa</span></button>
      <div id="inventory" class="inventory" aria-label="Inventário"></div>
      <button id="notesButton" class="tool" type="button" aria-label="Abrir caderneta de anotações"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 6h29v36H12a5 5 0 0 1-5-5V11a5 5 0 0 1 5-5Zm0 0v36m8-27h14m-14 8h14m-14 8h10"/></svg><span>Caderneta</span></button>
      <button id="resetButton" class="tool" type="button" title="Recomeçar">↺</button>
    </footer>
  </main>

  <script src="game.js"></script>

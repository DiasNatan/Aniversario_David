<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River Rush — Travessia</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
            /* Prevent scrolling on mobile */
            overflow: hidden;
        }
        canvas {
            border: 1px solid #000;
            background-color: #fff;
            touch-action: none; /* Prevents default touch actions like scrolling and zooming */
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Original game dimensions (all coordinates are based on this)
        const originalWidth = 600;
        const originalHeight = 800;
        let scaleFactor = 1;

        // Function to resize the canvas and update scale factor
        function resizeCanvas() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            const widthRatio = screenWidth / originalWidth;
            const heightRatio = screenHeight / originalHeight;
            scaleFactor = Math.min(widthRatio, heightRatio);

            // Set canvas size to fit the screen while maintaining aspect ratio
            canvas.width = originalWidth * scaleFactor;
            canvas.height = originalHeight * scaleFactor;

            // Set a maximum size for the canvas on very large screens
            if (canvas.width > 800) {
                scaleFactor = 800 / originalWidth;
                canvas.width = 800;
                canvas.height = originalHeight * scaleFactor;
            }
        }

        // Initial resize and a listener for window resize events
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Asset paths (make sure these are accessible)
        const assetPaths = {
            sounds: {
                bgm: 'assets/sounds/bgm.ogg',
                coinS: 'assets/sounds/coinS.ogg',
                gmover: 'assets/sounds/gmover.ogg'
            },
            images: {
                river1: "assets/images/river1.png",
                river2: "assets/images/river2.png",
                river3: "assets/images/river3.png",
                river4: "assets/images/river4.png",
                river5: "assets/images/river5.png",
                river6: "assets/images/river6.png",
                boat: "assets/images/boat1.png",
                wood1: "assets/images/wood1.png",
                wood2: "assets/images/wood2.png",
                wood3: "assets/images/wood3.png"
            }
        };

        // Load assets
        const assets = {
            sounds: {},
            images: {}
        };

        let assetsLoaded = 0;
        const totalAssets = Object.keys(assetPaths.sounds).length + Object.keys(assetPaths.images).length;

        function assetLoaded() {
            assetsLoaded++;
            if (assetsLoaded >= totalAssets) {
                startGameLoop();
            }
        }

        let gameLoopStarted = false;
        function startGameLoop() {
            if (!gameLoopStarted) {
                gameLoopStarted = true;
                requestAnimationFrame(gameLoop);
            }
        }

        // Pre-load sounds com ouvinte de erro e fallback
        for (const key in assetPaths.sounds) {
            assets.sounds[key] = new Audio(assetPaths.sounds[key]);
            assets.sounds[key].addEventListener('canplaythrough', assetLoaded, { once: true });
            assets.sounds[key].addEventListener('error', (err) => {
                console.warn('Não foi possível carregar o som: ' + assetPaths.sounds[key], err);
                assetLoaded();
            }, { once: true });
            assets.sounds[key].load(); // Added this for better mobile support
        }

        // Fallback de seguranca para iniciar o jogo caso audio trave no navegador
        setTimeout(() => {
            if (!gameLoopStarted) {
                console.warn('Iniciando loop do River Rush por fallback de timeout.');
                startGameLoop();
            }
        }, 2000);

        // Pre-load images
        for (const key in assetPaths.images) {
            assets.images[key] = new Image();
            assets.images[key].src = assetPaths.images[key];
            assets.images[key].onload = assetLoaded;
            assets.images[key].onerror = () => {
                console.error(`Failed to load image: ${assetPaths.images[key]}`);
                const placeholderCanvas = document.createElement('canvas');
                const placeholderCtx = placeholderCanvas.getContext('2d');
                placeholderCanvas.width = 64;
                placeholderCanvas.height = 64;
                placeholderCtx.fillStyle = 'red';
                placeholderCtx.fillRect(0, 0, 64, 64);
                assets.images[key].src = placeholderCanvas.toDataURL();
            };
        }

        let river_speed = 0;
        function riverXY(x, y, river_speed) {
            const imgWidth = assets.images.river1.width * scaleFactor;
            const imgHeight = assets.images.river1.height * scaleFactor;
            const scaledX = x * scaleFactor;
            const scaledY = y * scaleFactor;

            let riverImage;
            if (river_speed >= 0 && river_speed <= 50) {
                riverImage = assets.images.river1;
            } else if (river_speed >= 51 && river_speed <= 100) {
                riverImage = assets.images.river2;
            } else if (river_speed >= 101 && river_speed <= 150) {
                riverImage = assets.images.river3;
            } else if (river_speed >= 151 && river_speed <= 200) {
                riverImage = assets.images.river4;
            } else if (river_speed >= 201 && river_speed <= 250) {
                riverImage = assets.images.river5;
            } else {
                riverImage = assets.images.river6;
            }
            if (riverImage && riverImage.complete) { // Check if image is loaded
                ctx.drawImage(riverImage, scaledX, scaledY, imgWidth, imgHeight);
            }
        }

        let boat_x = 300;
        let boat_y = 520;
        let boat_xChange = 0;

        function boatXY(x, y) {
            if (assets.images.boat.complete) {
                ctx.drawImage(assets.images.boat, x * scaleFactor, y * scaleFactor, assets.images.boat.width * scaleFactor, assets.images.boat.height * scaleFactor);
            }
        }

        let wood1_x = 170;
        let wood1_y = -50;
        let wood2_x = 320;
        let wood2_y = -200;
        let wood3_x = 350;
        let wood3_y = -350;
        let wood4_x = 220;
        let wood4_y = -480;
        let wood5_x = 190;
        let wood5_y = -630;
        let wood_speed = 1;

        function woodXY(x, y, wood_img) {
            if (wood_img.complete) {
                ctx.drawImage(wood_img, x * scaleFactor, y * scaleFactor, wood_img.width * scaleFactor, wood_img.height * scaleFactor);
            }
        }

        let gameStart = false;
        const button_start = { x: 200, y: 690, width: 250, height: 80 };
        const button_pad = { x: 0, y: 650, width: 600, height: 150 };
        const button_left = { x: 20, y: 660, width: 120, height: 120 };
        const button_right = { x: 460, y: 660, width: 120, height: 120 };

        function draw_start_button() {
            ctx.fillStyle = 'rgb(10, 200, 10)';
            ctx.beginPath();
            ctx.roundRect(button_start.x * scaleFactor, button_start.y * scaleFactor, button_start.width * scaleFactor, button_start.height * scaleFactor, [20 * scaleFactor]);
            ctx.fill();
            ctx.fillStyle = 'rgb(0, 0, 0)';
            ctx.font = `${40 * scaleFactor}px sans-serif`;
            ctx.fillText("INICIAR", (button_start.x + 45) * scaleFactor, (button_start.y + 50) * scaleFactor);
        }

        function draw_button_pad() {
            ctx.fillStyle = 'rgb(200, 150, 200)';
            ctx.fillRect(button_pad.x * scaleFactor, button_pad.y * scaleFactor, button_pad.width * scaleFactor, button_pad.height * scaleFactor);
        }

        function draw_buttons() {
            ctx.fillStyle = 'rgb(100, 100, 100)';
            ctx.beginPath();
            ctx.roundRect(button_left.x * scaleFactor, button_left.y * scaleFactor, button_left.width * scaleFactor, button_left.height * scaleFactor, [20 * scaleFactor]);
            ctx.fill();
            ctx.fillStyle = 'rgb(0, 0, 0)';
            ctx.font = `${40 * scaleFactor}px sans-serif`;
            ctx.fillText("<<", (button_left.x + 30) * scaleFactor, (button_left.y + 75) * scaleFactor);

            ctx.fillStyle = 'rgb(100, 100, 100)';
            ctx.beginPath();
            ctx.roundRect(button_right.x * scaleFactor, button_right.y * scaleFactor, button_right.width * scaleFactor, button_right.height * scaleFactor, [20 * scaleFactor]);
            ctx.fill();
            ctx.fillStyle = 'rgb(0, 0, 0)';
            ctx.font = `${40 * scaleFactor}px sans-serif`;
            ctx.fillText(">>", (button_right.x + 30) * scaleFactor, (button_right.y + 75) * scaleFactor);
        }

        const CHALLENGE_TARGET = 10;
        const challengeMode = new URLSearchParams(window.location.search).get('challenge') === 'anniversary' || window.parent !== window;
        let challengePosted = false;

        function gameXY(x, y) {
            ctx.font = `bold ${80 * scaleFactor}px sans-serif`;
            ctx.fillStyle = 'rgb(110, 0, 0)';
            ctx.fillText('GAME OVER', x * scaleFactor, y * scaleFactor);
        }

        let score_value = 0;
        function scoreXY(x, y, score_value, player_name) {
            ctx.font = `bold ${24 * scaleFactor}px sans-serif`;
            ctx.fillStyle = 'rgb(100, 0, 100)';
            ctx.fillText('TRONCOS: ' + Math.min(score_value, CHALLENGE_TARGET) + ' / ' + CHALLENGE_TARGET, 210 * scaleFactor, 690 * scaleFactor);
        }

        let gameOver = false;
        let challengeWon = false;
        let background_music_start = false;
        let gameOver_music = false;

        function checkCollision(rect1, rect2) {
            const scaledRect1 = {
                x: rect1.x * scaleFactor,
                y: rect1.y * scaleFactor,
                width: rect1.width * scaleFactor,
                height: rect1.height * scaleFactor
            };
            const scaledRect2 = {
                x: rect2.x * scaleFactor,
                y: rect2.y * scaleFactor,
                width: rect2.width * scaleFactor,
                height: rect2.height * scaleFactor
            };

            return (
                scaledRect1.x < scaledRect2.x + scaledRect2.width &&
                scaledRect1.x + scaledRect1.width > scaledRect2.x &&
                scaledRect1.y < scaledRect2.y + scaledRect2.height &&
                scaledRect1.y + scaledRect1.height > scaledRect2.y
            );
        }

        function getCanvasPos(event) {
            const rect = canvas.getBoundingClientRect();
            const clientX = event.clientX || event.touches[0].clientX;
            const clientY = event.clientY || event.touches[0].clientY;
            return {
                x: (clientX - rect.left) / scaleFactor,
                y: (clientY - rect.top) / scaleFactor
            };
        }

        function isInside(pos, rect) {
            return pos.x > rect.x && pos.x < rect.x + rect.width && pos.y < rect.y + rect.height && pos.y > rect.y;
        }

        function handleInput(e) {
            e.preventDefault();
            const pos = getCanvasPos(e);

            if (gameOver) {
                const retry = { x: 210, y: 570, width: 180, height: 64 };
                if (!challengeWon && isInside(pos, retry)) resetChallenge();
                return;
            }

            if (isInside(pos, button_start) && !gameStart) {
                gameStart = true;
                assets.sounds.coinS.currentTime = 0;
                assets.sounds.coinS.play();
            }

            if (gameStart) {
                if (isInside(pos, button_right) && boat_x <= 400) {
                    assets.sounds.coinS.currentTime = 0;
                    assets.sounds.coinS.play();
                    boat_xChange = 2.5;
                }
                if (isInside(pos, button_left) && boat_x >= 170) {
                    assets.sounds.coinS.currentTime = 0;
                    assets.sounds.coinS.play();
                    boat_xChange = -2.5;
                }
            }
        }

        function resetChallenge() {
            score_value = 0; gameOver = false; challengeWon = false; challengePosted = false;
            gameStart = false; river_speed = 0; wood_speed = 1; background_music_start = false; gameOver_music = false;
            boat_x = 300; boat_xChange = 0;
            wood1_y = -50; wood2_y = -200; wood3_y = -350; wood4_y = -480; wood5_y = -630;
            assets.sounds.bgm.pause(); assets.sounds.bgm.currentTime = 0;
        }

        function handleInputEnd() {
            boat_xChange = 0;
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput);
        canvas.addEventListener('mouseup', handleInputEnd);
        canvas.addEventListener('touchend', handleInputEnd);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') { boat_xChange = -2.5; e.preventDefault(); }
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') { boat_xChange = 2.5; e.preventDefault(); }
            if (e.key === 'Enter' && !gameStart && !gameOver) gameStart = true;
            if (e.key === 'Enter' && gameOver && !challengeWon) resetChallenge();
        });
        window.addEventListener('keyup', (e) => { if (['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)) boat_xChange = 0; });

        // --- Main Game Loop ---
        function gameLoop() {
            ctx.fillStyle = 'rgb(255, 255, 255)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameStart && !gameOver) {
                if (!background_music_start) {
                    assets.sounds.bgm.loop = true;
                    assets.sounds.bgm.volume = 0.3;
                    assets.sounds.bgm.play();
                    background_music_start = true;
                }
                river_speed += 5;
            }
            if (river_speed >= 300) {
                river_speed = 0;
            }

            riverXY(0, 0, river_speed);

            if (gameStart && !gameOver) {
                wood1_y += wood_speed;
                if (wood1_y >= 710) {
                    wood1_x = 390 - (Math.floor(Math.random() * 7) * 30);
                    wood1_y = -80 - (Math.floor(Math.random() * 5) * 5);
                    score_value += 1;
                }
                wood2_y += wood_speed;
                if (wood2_y >= 720) {
                    wood2_x = 170 + (Math.floor(Math.random() * 4) * 40);
                    wood2_y = -80 - (Math.floor(Math.random() * 5) * 5);
                    score_value += 1;
                }
                wood3_y += wood_speed;
                if (wood3_y >= 730) {
                    wood3_x = 390 - (20 + Math.floor(Math.random() * 11) * 20);
                    wood3_y = -80 - (Math.floor(Math.random() * 3) * 10);
                    score_value += 1;
                }
                wood4_y += wood_speed;
                if (wood4_y >= 740) {
                    wood4_x = 210 + (Math.floor(Math.random() * 7) * 20);
                    wood4_y = -80 - (Math.floor(Math.random() * 5) * 5);
                    score_value += 1;
                }
                wood5_y += wood_speed;
                if (wood5_y >= 750) {
                    wood5_x = 250 + (Math.floor(Math.random() * 5) * 20);
                    wood5_y = -80 - (Math.floor(Math.random() * 5) * 5);
                    score_value += 1;
                }

                if (challengeMode && score_value >= CHALLENGE_TARGET) {
                    score_value = CHALLENGE_TARGET;
                    challengeWon = true;
                    gameOver = true;
                    if (!challengePosted) {
                        challengePosted = true;
                        assets.sounds.bgm.pause();
                        assets.sounds.coinS.currentTime = 0;
                        assets.sounds.coinS.play();
                        window.parent.postMessage({ type: 'riverChallengeComplete' }, '*');
                    }
                }

                let lastSpeedIncreaseScore = 0;
                if (score_value - lastSpeedIncreaseScore >= 10) {
                    wood_speed = 1 + (Math.floor(score_value / 10) * 0.5);
                    lastSpeedIncreaseScore = score_value - (score_value % 10);
                }
            }

            woodXY(wood1_x, wood1_y, assets.images.wood1);
            woodXY(wood2_x, wood2_y, assets.images.wood2);
            woodXY(wood3_x, wood3_y, assets.images.wood3);
            woodXY(wood4_x, wood4_y, assets.images.wood2);
            woodXY(wood5_x, wood5_y, assets.images.wood3);

            if (!gameOver) {
                boat_x += boat_xChange;
            }
            if (boat_x <= 170) boat_x = 170;
            if (boat_x >= 400) boat_x = 400;

            boatXY(boat_x, boat_y);

            const boat_rect = { x: boat_x + 10, y: boat_y + 35, width: assets.images.boat.width - 10, height: assets.images.boat.height - 30 };
            const wood1_rect = { x: wood1_x + 4, y: wood1_y + 15, width: assets.images.wood1.width - 12, height: assets.images.wood1.height - 7 };
            const wood2_rect = { x: wood2_x, y: wood2_y + 9, width: assets.images.wood2.width - 4, height: assets.images.wood2.height - 14 };
            const wood3_rect = { x: wood3_x + 12, y: wood3_y + 10, width: assets.images.wood3.width - 13, height: assets.images.wood3.height - 6 };
            const wood4_rect = { x: wood4_x, y: wood4_y + 9, width: assets.images.wood2.width - 4, height: assets.images.wood2.height - 14 };
            const wood5_rect = { x: wood5_x + 12, y: wood5_y + 10, width: assets.images.wood3.width - 13, height: assets.images.wood3.height - 6 };

            if (!gameOver && (checkCollision(boat_rect, wood1_rect) || checkCollision(boat_rect, wood2_rect) || checkCollision(boat_rect, wood3_rect) || checkCollision(boat_rect, wood4_rect) || checkCollision(boat_rect, wood5_rect))) {
                gameOver = true;
                if (!gameOver_music) {
                    assets.sounds.bgm.pause();
                    assets.sounds.gmover.play();
                    gameOver_music = true;
                }
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(255, 248, 220, 0.94)';
                ctx.fillRect(70 * scaleFactor, 250 * scaleFactor, 460 * scaleFactor, 260 * scaleFactor);
                ctx.textAlign = 'center';
                ctx.font = `bold ${(challengeWon ? 40 : 48) * scaleFactor}px sans-serif`;
                ctx.fillStyle = challengeWon ? 'rgb(20, 110, 40)' : 'rgb(110, 0, 0)';
                ctx.fillText(challengeWon ? 'TRAVESSIA CONCLUÍDA!' : 'VOCÊ CAIU NO RIO', 300 * scaleFactor, 330 * scaleFactor);
                ctx.font = `bold ${25 * scaleFactor}px sans-serif`;
                ctx.fillStyle = 'rgb(30, 50, 40)';
                ctx.fillText(challengeWon ? 'A outra margem esta logo ali.' : 'Tente atravessar novamente.', 300 * scaleFactor, 390 * scaleFactor);
                if (!challengeWon) {
                    ctx.fillStyle = 'rgb(10, 200, 10)';
                    ctx.beginPath();
                    ctx.roundRect(210 * scaleFactor, 570 * scaleFactor, 180 * scaleFactor, 64 * scaleFactor, [12 * scaleFactor]);
                    ctx.fill();
                    ctx.fillStyle = 'black';
                    ctx.font = `bold ${27 * scaleFactor}px sans-serif`;
                    ctx.fillText('TENTAR DE NOVO', 300 * scaleFactor, 610 * scaleFactor);
                }
                ctx.textAlign = 'start';
            }

            draw_button_pad();
            if (gameStart) {
                scoreXY(250, 690, score_value, '');
                draw_buttons();
            } else {
                if (!gameOver) draw_start_button();
            }
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>

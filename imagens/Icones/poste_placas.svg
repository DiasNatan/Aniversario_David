<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- Gradientes Metálicos para o Poste -->
    <linearGradient id="pole-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E9EAB" />
      <stop offset="30%" stop-color="#EEF2F3" />
      <stop offset="70%" stop-color="#8E9EAB" />
      <stop offset="100%" stop-color="#5C6B73" />
    </linearGradient>

    <!-- Gradiente das Placas Verdes -->
    <linearGradient id="sign-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F8A4B" />
      <stop offset="100%" stop-color="#075E31" />
    </linearGradient>
  </defs>

  <!-- Poste Metalizado -->
  <rect x="236" y="30" width="28" height="580" fill="url(#pole-grad)" stroke="#4A555C" stroke-width="2" />
  <ellipse cx="250" cy="30" rx="14" ry="5" fill="#EEF2F3" stroke="#4A555C" stroke-width="2" />
  <rect x="225" y="600" width="50" height="15" rx="4" fill="url(#pole-grad)" stroke="#4A555C" stroke-width="2" />

  <!-- Placa Superior (Direita) -->
  <g id="top-sign">
    <path d="M 140 60 L 400 60 L 450 110 L 400 160 L 140 160 Z" fill="url(#sign-grad)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
    <path d="M 140 60 L 400 60 L 450 110 L 400 160 L 140 160 Z" fill="none" stroke="#043D1E" stroke-width="4" stroke-linejoin="round" />
    <path d="M 146 66 L 396 66 L 440 110 L 396 154 L 146 154 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- Placa do Meio (Esquerda) -->
  <g id="middle-sign">
    <path d="M 340 180 L 80 180 L 30 230 L 80 280 L 340 280 Z" fill="url(#sign-grad)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
    <path d="M 340 180 L 80 180 L 30 230 L 80 280 L 340 280 Z" fill="none" stroke="#043D1E" stroke-width="4" stroke-linejoin="round" />
    <path d="M 334 186 L 84 186 L 40 230 L 84 274 L 334 274 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- Placa Inferior (Direita) -->
  <g id="bottom-sign">
    <path d="M 160 300 L 420 300 L 470 350 L 420 400 L 160 400 Z" fill="url(#sign-grad)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" />
    <path d="M 160 300 L 420 300 L 470 350 L 420 400 L 160 400 Z" fill="none" stroke="#043D1E" stroke-width="4" stroke-linejoin="round" />
    <path d="M 166 306 L 416 306 L 460 350 L 416 394 L 166 394 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
  </g>
</svg>
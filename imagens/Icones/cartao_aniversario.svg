<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65a5a"/>
      <stop offset="100%" stop-color="#991d2d"/>
    </linearGradient>
    <linearGradient id="envFlap" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff7b7b"/>
      <stop offset="100%" stop-color="#b82535"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="100%" stop-color="#faebd0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#071711" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#cardShadow)">
    <!-- Envelope Body -->
    <rect x="18" y="46" width="92" height="64" rx="10" fill="url(#envGrad)" stroke="#6d121c" stroke-width="2"/>
    
    <!-- Letter / Card Inside (Extended Outward) -->
    <rect x="27" y="18" width="74" height="54" rx="7" fill="url(#cardGrad)" stroke="#dfb652" stroke-width="2.5"/>
    
    <!-- Decorative gold header border on card -->
    <path d="M 28 26 L 100 26" stroke="#e8c872" stroke-width="2" stroke-dasharray="3 2"/>

    <!-- Letter text lines -->
    <line x1="36" y1="36" x2="68" y2="36" stroke="#cf9c34" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="46" x2="88" y2="46" stroke="#bda27e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="36" y1="54" x2="82" y2="54" stroke="#bda27e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="36" y1="62" x2="66" y2="62" stroke="#bda27e" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Gold Sparkle Accent -->
    <path d="M 83 31 L 85 36 L 90 38 L 85 40 L 83 45 L 81 40 L 76 38 L 81 36 Z" fill="#f5ca5a"/>

    <!-- Envelope Front Triangles / Pockets -->
    <path d="M 18 108 L 56 70 L 18 50 Z" fill="#b92434"/>
    <path d="M 110 108 L 72 70 L 110 50 Z" fill="#aa1f2e"/>
    <path d="M 18 110 L 64 74 L 110 110 Z" fill="url(#envFlap)" stroke="#6d121c" stroke-width="1.5"/>

    <!-- Golden Heart Wax Seal -->
    <circle cx="64" cy="74" r="13" fill="#f8d66c" stroke="#b48818" stroke-width="2"/>
    <path d="M 64 79.5 C 64 79.5 58 74.2 58 70.8 C 58 68.5 59.8 67 61.8 67 C 63 67 63.8 67.7 64 68.3 C 64.2 67.7 65 67 66.2 67 C 68.2 67 70 68.5 70 70.8 C 70 74.2 64 79.5 64 79.5 Z" fill="#b91c2c"/>
  </g>
</svg>


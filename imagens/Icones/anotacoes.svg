<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73D6FA" />
      <stop offset="100%" stop-color="#2896DB" />
    </linearGradient>
    
    <linearGradient id="pencil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7B731" />
      <stop offset="100%" stop-color="#EB3B5A" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="rotate(-5 300 300)">
    <!-- Prancheta Base Azul (3D Soft) -->
    <rect x="140" y="80" width="320" height="440" rx="28" fill="url(#base-grad)" />
    
    <!-- Bloco de Folhas Brancas -->
    <path d="M 160 100 L 440 100 L 440 470 C 440 470, 360 480, 300 480 C 240 480, 160 470, 160 470 Z" fill="#FFFFFF" />
    
    <!-- Dobra da Folha Inferior -->
    <path d="M 320 480 C 390 480, 440 450, 440 450 L 360 420 Z" fill="#E2E8F0" />
    
    <!-- Linhas da Folha -->
    <line x1="190" y1="160" x2="410" y2="160" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="200" x2="410" y2="200" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="240" x2="410" y2="240" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="280" x2="410" y2="280" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="320" x2="410" y2="320" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />
    <line x1="190" y1="360" x2="410" y2="360" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" />

    <!-- Anéis Espirais Superiores -->
    <g fill="#A0AEC0" stroke="#4A5568" stroke-width="2">
      <rect x="200" y="65" width="16" height="40" rx="8" />
      <rect x="260" y="65" width="16" height="40" rx="8" />
      <rect x="320" y="65" width="16" height="40" rx="8" />
      <rect x="380" y="65" width="16" height="40" rx="8" />
    </g>

    <!-- Lápis 3D em Diagonais -->
    <g transform="rotate(-40 300 270)">
      <rect x="285" y="180" width="30" height="130" rx="6" fill="url(#pencil-grad)" />
      <!-- Borracha -->
      <path d="M 285 180 L 315 180 L 315 165 C 315 158, 285 158, 285 165 Z" fill="#FC5C65" />
      <rect x="283" y="175" width="34" height="10" rx="2" fill="#A5B1C2" />
      <!-- Ponta de Madeira e Grafite -->
      <polygon points="285,310 315,310 300,340" fill="#F7D794" />
      <polygon points="295,330 305,330 300,340" fill="#2D98DA" />
    </g>
  </g>
</svg>